# Déploiement du carnet sur Netlify.
# Site : carnet-de-recettes-celine.netlify.app
#
# Hypothèse : build.py assemble le site dans dist/.
# Si le site est publié tel quel, sans étape de construction,
# retirer "command" et mettre publish = ".".

[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
