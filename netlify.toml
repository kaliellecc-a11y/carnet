# Déploiement du carnet sur Netlify.
# Projet : carnet-de-recettes-celine (667569cd-4577-48ba-978f-2cb5bf1e48a4)
# https://carnet-de-recettes-celine.netlify.app
#
# Le dépôt est la source : un push sur main déclenche la construction.
# build.py écrit carnet-de-fournil.standalone.html à la racine ; Netlify sert
# index.html, d'où la copie vers dist/.
#
# Pas de PYTHON_VERSION épinglée : build.py tourne dès Python 3.8, et toutes
# les images de build Netlify en fournissent une plus récente. Épingler une
# version absente de l'image ferait échouer le build sans rien apporter.

[build]
  command = "pip install -r requirements.txt && python3 build.py && mkdir -p dist && cp carnet-de-fournil.standalone.html dist/index.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
