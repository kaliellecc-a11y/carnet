# Déploiement du carnet sur Netlify.
# Projet : carnet-de-recettes-celine (667569cd-4577-48ba-978f-2cb5bf1e48a4)
# https://carnet-de-recettes-celine.netlify.app
#
# Le dépôt est la source : un push sur main déclenche la construction.
# build.py assemble lui-même dist/ : la page, le service worker, le manifeste
# et les icônes. Le service worker doit être servi depuis la racine du site,
# sinon sa portée ne couvre pas le carnet.
#
# Pas de PYTHON_VERSION épinglée : build.py tourne dès Python 3.8, et toutes
# les images de build Netlify en fournissent une plus récente. Épingler une
# version absente de l'image ferait échouer le build sans rien apporter.

[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

# Un service worker mis en cache par le navigateur fige le site sur une
# version : il doit toujours être revalidé.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
